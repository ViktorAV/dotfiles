# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(212121ee)
    col.inactive_border = rgba(000000aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Затемнение
    dim_inactive = true
    dim_strength = 0.25 # 0.0 - 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
  enabled = yes
  # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
  #        NAME,        X0,   Y0,   X1,   Y1
  bezier = linear, 0, 0, 1, 1
  bezier = ease, 0.42, 0, 0.58, 1
  bezier = easeIn, 0.42, 0, 1, 1
  bezier = easeOut, 0, 0, 0.58, 1
  bezier = bounce, 0.68, -0.55, 0.27, 1.55
  bezier = soft, 0.25, 0.1, 0.25, 1
  bezier = quickStop, 0, 0, 0.8, 1
  bezier = wave, 0.3, 0, 0.7, 1

  # Default animations, see https://wiki.hypr.land/Configuring/Animations/
  #           NAME, ONOFF, SPEED, CURVE, [STYLE]
  animation = windows, 1, 5, bounce, slide
  animation = windowsIn, 1, 5, bounce, slide top
  animation = windowsOut, 1, 5, bounce, slide bottom
  animation = fade, 1, 7, soft
  animation = layers, 1, 7, bounce, slide bottom
  animation = workspaces, 1, 5.00, soft, slide
  animation = specialWorkspace, 1, 4, bounce, slide top

  # windows - окна (открытие, закрытие, перемещение, изменение размера) slide,popin,gnomed
  # Также после slide можно указать top, right, bottom, left
  # windowsIn - открытие
  # windowsOut - закрытие
  # windowsMove - перемещение и изменение размера

  # layers - слои (например, всплывающие меню) slide, popin, fade
  # layersIn - открытие
  # layersOut - закрытие

  # fade - плавное затухание для окон и слоев (открытие, закрытие, смена активного)
  # fadeIn - открытие
  # fadeOut - закрытие
  # fadeSwitch - смена активного окна
  # fadeShadow - затухание теней при смене активного окна
  # fadeDim - затемнение неактивных окон
  # fadeLayers - для слоев
  # fadeLayersIn - открытие
  # fadeLayersOut закрытие
  # fadePopups - всплывающие окна Wayland
  # fadePopupsIn - открытие
  # fadePopupsOut - закрытие
  # fade Dpms - при включении/выключении DPMS

  # workspaces - рабочие пространства (вход, выход)
  # workspacesIn - вход
  # workspacesOut - выход
  # specialWorkspace - специальные рабочие пространства (вход, выход)
  # specialWorkspaceIn - вход
  # specialWorkspaceOut - выход

  # zoomFactor - анимация изменения масштаба экрана
  # monitorAdded - анимация при добавлении монитора
  # border - анимация изменения цвета границы окна
  # borderangle - анимация изменения угла градиента границы
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# opengl {
#     nvidia_anti_flicker = true
# }

cursor {
    sync_gsettings_theme = false
    no_hardware_cursors = 1
}
